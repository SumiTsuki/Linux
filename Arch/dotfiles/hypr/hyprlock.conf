# === 基础设置 ===
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0  # 立即要求输入密码（无等待）
    no_fade_in = false  # 启用淡入效果
}

# === 背景设置（模糊当前屏幕） ===
background {
    monitor =
    path = screenshot  # 使用当前屏幕截图
    blur_passes = 3    # 模糊强度
    blur_size = 8
    brightness = 0.7
    contrast = 1.2
}

# === 密码输入框（强制显示并验证） ===
input-field {
    monitor =
    size = 250, 50
    position = 0, -20
    halign = center
    valign = center

    # 样式设置
    outline_thickness = 2
    outer_color = rgba(80, 80, 80, 0.8)
    inner_color = rgba(50, 50, 50, 0.2)
    font_color = rgb(240, 240, 240)

    # 密码验证反馈
    fade_on_empty = false  # 始终显示输入框
    placeholder_text = <i>󰌾 Enter Password...</i>  # Nerd Font 锁图标
    hide_input = true      # 隐藏输入内容（显示为***）
    rounding = 10          # 圆角大小
    check_color = rgba(100, 255, 100, 0.7)  # 密码正确时的颜色
    fail_color = rgba(255, 100, 100, 0.7)   # 密码错误时的颜色
    fail_transition = 300  # 错误提示动画时长（ms）
}

# === 时间显示 ===
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# === 日期显示 ===
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %Y-%m-%d')"
    color = rgba(200, 200, 200, 0.8)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# === 解锁提示 ===
label {
    monitor =
    text =  Locked - Enter your password
    color = rgba(150, 150, 150, 0.6)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -70
    halign = center
    valign = center
}
